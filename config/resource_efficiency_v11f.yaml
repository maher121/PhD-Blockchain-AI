  raw_dataco_reopen_allowed: false
  test_access: FORBIDDEN
  test_access_count_required: 0
  upstream_mutation_allowed: false

ai_policy:
  ai_fit_allowed: false
  ai_inference_allowed: false
  model_loading_for_new_scoring_allowed: false
  retraining_allowed: false
  new_risk_prediction_allowed: false
  frozen_ai_derived_outcomes_context_only: true

new_measurement_policy:
  new_timing_campaign: false
  new_memory_campaign: false
  new_tracemalloc_campaign: false
  new_storage_campaign: false
  new_throughput_campaign: false
  new_security_campaign: false
  new_energy_campaign: false
  rerun_e06_allowed: false
  rerun_e07_allowed: false
  rerun_e08_allowed: false
  rerun_e09_allowed: false
  rerun_e10_allowed: false

policies:
  allowed: [B0, B1, P]
  additions_allowed: false
  tuning_allowed: false
  definition_changes_allowed: false
  execution_allowed: false

allowed_metric_families:
  runtime:
    metrics: [persisted_wall_clock_timing, persisted_cpu_process_timing]
    interpretation: runtime evidence; not energy
    lower_value_direction: lower runtime proxy
  computational_work:
    metrics: [validation_check_count, validator_invocation_count, measurable_hash_operation_count]
    interpretation: deterministic computational-work evidence; not energy
    lower_value_direction: lower computational-work count
  memory:
    metrics: [persisted_tracemalloc_peak_proxy]
    interpretation: fresh-process tracemalloc peak / Python traced-allocation memory proxy
    forbidden_interpretations: [RSS, total_process_memory, system_memory, hardware_memory_consumption, electrical_energy]
    lower_value_direction: lower Python traced-allocation proxy
  storage:
    metrics: [persisted_canonical_serialized_bytes]
    interpretation: policy-independent canonical serialized storage evidence
    lower_value_direction: lower serialized bytes
  throughput:
    metrics: [persisted_validated_orders_per_second]
    interpretation: throughput evidence; not energy
    higher_value_direction: higher validated orders per second

e07:
  measurement: tracemalloc_fresh_worker
  required_terms: [fresh-process tracemalloc peak, Python traced-allocation memory proxy]
  label: COMPUTATIONAL_MEMORY_PROXY
  rss_measurement: false
  electrical_energy_measurement: false

e08:
  status: POLICY_INDEPENDENT
  persisted_policy_token: B0
  token_semantics: serialization placeholder only; not a policy comparison
  policy_storage_differences_allowed: false
  manufactured_b0_b1_p_storage_differences_forbidden: true

e10:
  status: DERIVED_ONLY
  sources: [E06, E07, E08, E09]
  fourth_campaign_allowed: false
  independent_measurement_allowed: false

direct_energy_policy:
  status: DIRECT_ENERGY_UNAVAILABLE
  cpu_time_is_energy: false
  wall_time_is_energy: false
  tracemalloc_is_energy: false
  throughput_is_energy: false
  storage_is_energy: false
  prohibited_estimates: [Joules, Wh, kWh, Watts, TDP-derived_energy, carbon_emissions, CO2e]
  prohibited_proxy_claims: [energy_saved, energy_reduction, power_reduction, carbon_reduction]
  allowed_wording:
    - computational resource proxy
    - resource-efficiency evidence
    - lightweight computational behavior
    - runtime evidence
    - throughput evidence
    - memory proxy
    - storage evidence
  future_direct_measurement_requires_separate_governance: true

population:
  governed_order_count: 4588
  risk_band_counts: {LOW: 0, MEDIUM: 4582, HIGH: 6}
  low_marker: LOW_ABSENT_IN_GOVERNED_POPULATION
  high_evidence: SPARSE_DESCRIPTIVE_ONLY
  workload_100_high_marker: HIGH_NOT_OBSERVED_IN_CONDITION
  strong_high_subgroup_inference_allowed: false
  aggregate_p_evidence_note: overwhelmingly MEDIUM-driven

workloads:
  order_counts: [100, 250, 500, 1000, 2500]
  seeds: [522, 523, 524]
  nesting: "100 subset 250 subset 500 subset 1000 subset 2500 within each seed"
  independent_replicates: false
  seed_workload_cells_may_be_treated_as_15_independent_replicates: false

descriptive_analysis:
  status: DESCRIPTIVE_ONLY
  allowed_summaries: [mean, median, sample_standard_deviation_ddof_1, min, max, coefficient_of_variation]
  coefficient_of_variation_formula: sample_standard_deviation_ddof_1 / abs(arithmetic_mean)
  coefficient_of_variation_precondition: arithmetic_mean != 0
  allowed_matched_differences:
    B1_minus_B0: metric(B1, seed, workload) - metric(B0, seed, workload)
    P_minus_B0: metric(P, seed, workload) - metric(B0, seed, workload)
    P_minus_B1: metric(P, seed, workload) - metric(B1, seed, workload)
  normalized_ratio_formula: metric(numerator_policy, seed, workload) / metric(denominator_policy, seed, workload)
  normalized_ratio_preconditions:
    - exact seed/workload match
    - denominator is strictly positive
    - metric family and direction are explicitly reported
    - E08 storage is excluded from policy ratios
  forbidden:
    - p_values
    - statistical_significance_claims
    - bootstrap_inference
    - order_level_inference
    - inferential_confidence_intervals
    - composite_overall_policy_score
    - overall_policy_winner
    - universal_superiority
    - global_policy_ranking
  reason: three fixed seeds, nested workloads, and pseudoreplication risk

pairing:
  minimum_keys: [seed, workload]
  require_identical_metric_family: true
  require_one_observation_per_policy_key: true
  unmatched_comparison_policy: FAIL_CLOSED
  additional_governed_keys_required_when_present: [experiment_id, measurement_boundary, machine_environment]

security_context:
  role: FROZEN_UPSTREAM_TRADE_OFF_CONTEXT_ONLY
  new_security_evaluation_allowed: false
  e02_detection_counts:
    denominator_per_policy: 135
    B0: 30
    B1: 105
    P: 75
  e04_unaffected_order_preservation:
    numerator_per_policy: 117315
    denominator_per_policy: 117315
  e03_independent_confirmatory_evidence: false
  e03_reason: binary localization outcomes mirrored E02 detection in the governed run

trade_off_interpretation:
  endpoint_specific_only: true
  B1: greater governed attack-scenario coverage, higher runtime, lower throughput
  B0: lower runtime, higher throughput, lower governed attack coverage
  P: intermediate/adaptive behavior on several endpoints
  overall_winner_allowed: false
  universal_superiority_allowed: false

future_f2_fail_closed:
