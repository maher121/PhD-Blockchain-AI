stage: "V1.1-D1"
kind: "SCIENTIFIC_DECISION_PROTOCOL_LOCK"
protocol_version: "v1.1-d1-governed-ai-risk-1"
protocol_classification: "GOVERNED_AI_BLOCKCHAIN_SCIENTIFIC_DECISIONS_LOCKED"

stage_identity:
  title: "Governed AI-Blockchain Scientific Decision Lock"
  purpose: >-
    Preregister the scientific decisions that convert frozen V1.0 HYBRID-K13
    row-level attack evidence into a future V1.1-D per-order governed risk
    artifact. This stage defines protocol only and produces no predictions,
    risk records, AI_RISK_ASSESSED blocks, or experimental results.
  implementation_excluded: true
  prediction_generation_excluded: true
  blockchain_experiment_execution_excluded: true

upstream:
  starting_checkpoint: "e5c85aea6492431d37732b4214fef4974ad5c088"
  v10_closed_immutable: true
  v11a_v11b_v11c_immutable: true
  v10d_winner_semantic_sha256: "1c258dc1a90ad78197d25e62bbc9fca24904cbcb77edafd24b12726059e49d84"
  v10e_result_semantic_sha256: "ffca0957006bff3115705f9dfb0334e13a27c9abbc502f2c9d04f784a28141e9"
  v11a_protocol_semantic_sha256: "aaf3ac3139e8296fb7f976a8a7ed9f18eb317af2f73b10cd0208b6bb870ebd8d"
  v11c_mapping_semantic_sha256: "c992429b2165f18649d36b0339260d9a95e1ae8524d7dfd586a168504d3cc765"
  v11c_canonical_development_orders: 25881
  v11c_development_rows: 34000

